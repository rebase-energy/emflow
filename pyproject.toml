[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emflow"
version = "0.3.0"
authors = [
    { name = "rebase.energy" }
]
description = "⚡ Open-source framework for sequential decision problems in the energy sector"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "energydatamodel>=0.7.0,<0.8.0",
    "gymnasium>=1.1.1",
    "fsspec>=2023.1.0",
    "huggingface_hub>=0.20",  # Hugging Face-backed rb:// filesystem
    "pyyaml>=6.0",            # rebase.yaml dataset manifests
    "pyarrow>=15.0.0",        # parquet IO for benchmark datasets
]

[project.urls]
Homepage = "https://emflow.org"
Repository = "https://github.com/rebase-energy/emflow"
Documentation = "https://docs.emflow.org/en/latest"

# Make the ``rb://`` scheme discoverable by fsspec without an explicit
# ``import emflow`` — same mechanism huggingface_hub uses for ``hf://``.
[project.entry-points."fsspec.specs"]
rb = "emflow.data.io.rebasefs:RebaseFileSystem"

[project.optional-dependencies]
examples = [
    "matplotlib>=3.8",
    "plotly>=5.0",
]
submissions = [
    "huggingface_hub>=0.20",
]
build-data = [  # scripts/build_*.py dataset ingestion
    "xarray>=2024.1",
    "netCDF4>=1.6",
]
dev = [
    "pytest>=8.0",
    "build>=1.2.2",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "myst-parser>=4.0.1",
    "nbsphinx>=0.9.7",
    "pyarrow>=15.0.0",
    "sphinx==7.2.6",
    "sphinx-autodoc-typehints>=2.0.1",
    "sphinx-rtd-theme>=3.0.2",    
    "twine>=6.1.0", 
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"emflow.examples.data" = ["*.csv", "*.parquet"]
"emflow.benchmarks.heftcom2024" = ["*.csv"]
"emflow.benchmarks.gefcom2014" = ["*.yaml"]
"emflow.benchmarks.gefcom2012_load" = ["*.yaml"]
"emflow.benchmarks.gefcom2012_wind" = ["*.yaml"]
"emflow.benchmarks.gefcom2017" = ["*.yaml"]
"emflow.benchmarks.bfcom2018" = ["*.yaml"]
"emflow.benchmarks.bigdeal2022" = ["*.yaml"]
